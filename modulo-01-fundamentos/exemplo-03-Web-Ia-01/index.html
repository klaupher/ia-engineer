<output id="output"></output>
<button id="generateButton" hidden>Iniciar Download</button>
<script src="https://cdn.jsdelivr.net/npm/markdown@0.5.0/lib/markdown.min.js"></script>

<script>
  document
    .getElementById("generateButton")
    .addEventListener("click", async () => {
      try {
        // Como isso ocorreu a partir de um clique, o Chrome permite o download
        const ai = await LanguageModel.create();
        console.log("Modelo carregado e pronto para uso!");
      } catch (erro) {
        console.error("Erro ao carregar a IA:", erro);
      }
    });
  const output = document.getElementById("output");

  (async () => {
    const initialPrompts = [
      {
        role: "system",
        content: `Você é um assistente de IA que responde de forma clara e objetiva.`,
      },
    ];

    const question = "Quem inventou a linguagem c++?";
    output.innerHTML = "Gerando resposta...";

    const availableModels = await LanguageModel.availability([
      {
        expectedInputLanguages: ["pt"],
      },
    ]);

    if (availableModels === "unavailable") {
      document.getElementById("generateButton").hidden = false;
      return;
    }

    if (!availableModels.length) {
      output.innerHTML = "Nenhum modelo disponível para o idioma solicitado.";
      return;
    } else if (availableModels === "downloading") {
      output.innerHTML = `⚠️ O modelo de linguagem de IA está sendo baixado. Por favor, aguarde alguns minutos e tente novamente.`;
      return;
    } else if (availableModels === "downloadable") {
      output.innerHTML = `⚠️ O modelo de linguagem de IA precisa ser baixado, baixando agora... (acompanhe o progresso no terminal do chrome)`;
      return;
    } else {
      const session = await LanguageModel.create({
        expectedInputLanguages: ["pt"],
        initialPrompts,
      });

      const responseStream = await session.promptStreaming([
        {
          role: "user",
          content: question,
        },
      ]);
      output.innerHTML = "";
      let fullText = "";
      for await (const token of responseStream) {
        fullText += token;
        output.innerHTML = markdown.toHTML(fullText);

        // console.log(token)
      }
    }
  })();
</script>
